[package]
name = "octobeat-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust core for the OctoBeat Qt 6 port"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
walkdir = "2.5"

[lints.clippy]
all = { level = "warn", priority = -1 }
