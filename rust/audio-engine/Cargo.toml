[package]
name = "octobeat-audio"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native Rust audio engine for OctoBeat"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1"
cpal = "0.15.3"
rtrb = "0.4"
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats"] }
symphonia-opus = "0.1.3"

[lints.clippy]
all = { level = "warn", priority = -1 }
