name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.0.0"

jobs:
  linux-tar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libdbus-1-dev libgl1-mesa-dev libxkbcommon-dev \
            python3-venv unzip curl
      - uses: dtolnay/rust-toolchain@stable
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtsvg
      - name: Build helper binaries
        run: packaging/tools/build-linux.sh
      - name: Build tarball
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build-release -j "$(nproc)"
          cd build-release
          cpack --config CPackConfig.cmake
          mkdir -p ../dist
          cp OctoBeat-*-Linux-*.tar.gz ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: dist/*.tar.gz

  arch-package:
    needs: [linux-tar]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-tar
          path: dist
      - name: Build pacman package
        run: |
          chmod -R a+rwX .
          docker run --rm -v "$PWD:/work" archlinux:latest bash -c '
            pacman -Syu --noconfirm base-devel
            useradd -m builder
            chown -R builder:builder /work
            su - builder -c /work/packaging/arch/ci-package.sh
          '
          cp packaging/arch/octobeat-bin-*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-venv unzip curl
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.flatpak.Builder \
            org.kde.Platform//6.11 org.kde.Sdk//6.11 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Build helper binaries
        run: |
          packaging/tools/build-linux.sh
          # Build SomeDL against the Flatpak SDK's glibc and Python.
          rm -rf packaging/tools/.flatpak-somedl
          mkdir -p packaging/tools/.flatpak-somedl
          flatpak run --devel --share=network \
            --filesystem="$PWD:rw" --command=bash org.kde.Sdk//6.11 -c \
            "set -e; cd '$PWD/packaging/tools/.flatpak-somedl'; \
             python3 -m venv venv; \
             venv/bin/pip install --quiet somedl pyinstaller; \
             venv/bin/pyinstaller --onefile --noconfirm --name somedl \
               --collect-all SomeDL --collect-all ytmusicapi \
               --collect-all yt_dlp venv/bin/somedl >/dev/null; \
             cp dist/somedl '$PWD/packaging/tools/runtime/somedl'; \
             chmod +x '$PWD/packaging/tools/runtime/somedl'"
      - name: Build Flatpak
        run: |
          mkdir -p dist
          packaging/flatpak/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: dist/*.flatpak

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtsvg
      - name: Build helper binaries
        shell: pwsh
        run: packaging/tools/build-windows.ps1
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build-release -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_INSTALL_PREFIX="$PWD\dist\OctoBeat"
          cmake --build build-release --config Release -j 16
          cmake --install build-release --config Release
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release --compiler-runtime --no-translations `
            "$PWD\dist\OctoBeat\bin\octobeat.exe"
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:APP_VERSION" `
            "/DMyAppNumericVersion=$env:APP_VERSION.0" `
            "packaging\windows\OctoBeat.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-tar, arch-package, flatpak, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
