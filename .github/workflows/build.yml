name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запустить сборку вручную кнопкой

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Используем 3.12, так как она стабильнее для PyInstaller, чем 3.14
        cache: 'pip'

    - name: Install VLC (Required for libvlc.dll)
      run: choco install vlc -y

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --clean --noconfirm OctoBeat.spec

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OctoBeat-Windows
        path: dist/OctoBeat/
        retention-days: 5
